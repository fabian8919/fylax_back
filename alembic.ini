# Alembic — migraciones versionadas (PRD §4: SQLAlchemy 2 + Alembic).
# La metadata se toma de los modelos en app/db/models.py.

[alembic]
script_location = alembic
prepend_sys_path = .
# url se sobreescribe en env.py desde la variable DATABASE_URL.
sqlalchemy.url = driver://user:pass@host/db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
