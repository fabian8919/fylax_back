name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Tipos (mypy)
        run: mypy app

      - name: Tests
        run: pytest -v --tb=short

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO(Fase 6): build de imagen Docker y despliegue a Cloud Run
      # (auth con Workload Identity Federation + gcloud run deploy).
      - run: echo "Deploy a Cloud Run pendiente (Fase 6)"
